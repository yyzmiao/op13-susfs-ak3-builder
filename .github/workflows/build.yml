name: Build OnePlus 13 (GKI) Kernel with KSUN & SuSFS

on:
  workflow_dispatch:
    inputs:
      android_kernel_version:
        description: '内核版本分支 (一加13当前选 android15-6.6)'
        required: true
        type: choice
        options:
          - 'android15-6.6'
          - 'android16-6.12'
          - 'android14-6.1'
          - 'android14-5.15'
        default: 'android15-6.6'

      custom_kernel_tag:
        description: '（可选）指定精准的 Git Tag（留空则默认拉取该分支最新源码）'
        required: false
        default: ''

      ksu_branch:
        description: 'KernelSU-Next 版本分支或 Tag (最新选 next，也可填如 v1.0.5)'
        required: true
        default: 'next'

      susfs_branch:
        description: 'SuSFS 补丁分支 (默认 auto 会自动匹配对应安卓大版本)'
        required: true
        default: 'auto'

jobs:
  build:
    name: Build GKI Kernel & Pack AK3
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 清理环境并安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates curl flex gcc-aarch64-linux-gnu \
            git libssl-dev libelf-dev make python3 zip unzip libarchive-tools patch
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: 2. 配置 Google 官方 AOSP Clang 工具链
        run: |
          echo "⬇️ 正在拉取 Google AOSP 官方 Clang (r510928)..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git clang-toolchain
          echo "$GITHUB_WORKSPACE/clang-toolchain/bin" >> $GITHUB_PATH

      - name: 3. 智能确定分支并拉取 GKI 源码
        run: |
          TARGET_BRANCH="${{ github.event.inputs.android_kernel_version }}"
          if [ -n "${{ github.event.inputs.custom_kernel_tag }}" ]; then
            TARGET_BRANCH="${{ github.event.inputs.custom_kernel_tag }}"
          fi

          SUSFS_BR="${{ github.event.inputs.susfs_branch }}"
          if [ "$SUSFS_BR" = "auto" ]; then
            SUSFS_BR="gki-${{ github.event.inputs.android_kernel_version }}"
          fi
          echo "FINAL_SUSFS_BRANCH=$SUSFS_BR" >> $GITHUB_ENV

          echo "⬇️ 正在拉取 GKI 源码分支: $TARGET_BRANCH..."
          git clone --depth=1 -b $TARGET_BRANCH https://android.googlesource.com/kernel/common kernel-source
          cd kernel-source
          
          # 读取真实内核子版本号 (例如 6.6.118)
          RAW_VERSION=$(make kernelversion 2>/dev/null || grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | awk '{print $3}' | paste -sd.)
          echo "=========================================="
          echo "✅ 成功拉取内核源码，确切版本为: $RAW_VERSION"
          echo "=========================================="
          echo "KERNEL_SRC=$PWD" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$RAW_VERSION" >> $GITHUB_ENV

      - name: 4. 集成最新 KernelSU-Next
        run: |
          cd $KERNEL_SRC
          echo "⬇️ 正在配置 KernelSU-Next (${{ github.event.inputs.ksu_branch }})..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ github.event.inputs.ksu_branch }}/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_branch }}

      - name: 5. 严格打入 SuSFS 深度隐藏补丁
        run: |
          cd $GITHUB_WORKSPACE
          echo "⬇️ 正在拉取 SuSFS 补丁分支: $FINAL_SUSFS_BRANCH..."
          git clone --depth=1 -b $FINAL_SUSFS_BRANCH https://gitlab.com/simonpunk/susfs4kernel.git susfs4kernel || \
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4kernel.git susfs4kernel
          
          # 拷贝 SuSFS 核心代码到内核源码树
          cp -r susfs4kernel/kernel_patches/fs/* $KERNEL_SRC/fs/
          cp -r susfs4kernel/kernel_patches/include/linux/* $KERNEL_SRC/include/linux/

          # 应用内核补丁
          cd $KERNEL_SRC
          PATCH_FILE=$(find $GITHUB_WORKSPACE/susfs4kernel/kernel_patches/ -name "50_add_susfs_in_*.patch" | head -n 1)
          if [ -n "$PATCH_FILE" ]; then
            echo "⚙️ 正在应用内核补丁: $(basename $PATCH_FILE)..."
            patch -p1 --forward < "$PATCH_FILE" || true
          fi
          
          # 应用 KernelSU-Next 补丁
          echo "⚙️ 正在应用 KSUN 的 SuSFS 补丁..."
          KSU_PATCH=$(find $GITHUB_WORKSPACE/susfs4kernel/kernel_patches/ -name "10_enable_susfs_for_ksu.patch" | head -n 1)
          if [ -n "$KSU_PATCH" ]; then
            if [ -d "$KERNEL_SRC/KernelSU" ]; then
              cd $KERNEL_SRC/KernelSU
              patch -p1 --forward < "$KSU_PATCH" || true
            elif [ -d "$KERNEL_SRC/drivers/kernelsu" ]; then
              cd $KERNEL_SRC/drivers/kernelsu
              patch -p1 --forward < "$KSU_PATCH" || true
            fi
          fi

      - name: 6. 纯净编译内核 Image (无防格机写保护拦截)
        run: |
          cd $KERNEL_SRC
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          make gki_defconfig
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_SU
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT

          echo "🚀 开始多核高速编译 Image..."
          make -j$(nproc --all) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- Image
          
          if [ -f "arch/arm64/boot/Image" ]; then
            echo "=========================================="
            echo "🎉 内核 Image 编译成功！大小: $(du -h arch/arm64/boot/Image | awk '{print $1}')"
            echo "=========================================="
          else
            echo "❌ 未找到 Image 文件，编译失败！" && exit 1
          fi

      - name: 7. 打包 AnyKernel3 (AK3) 刷机包
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3
          
          cp $KERNEL_SRC/arch/arm64/boot/Image ./
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' anykernel.sh

          BUILD_DATE=$(date +%Y%m%d_%H%M)
          ZIP_NAME="AK3_OP13_${{ env.KERNEL_VERSION }}_KSUN_${{ github.event.inputs.ksu_branch }}_SuSFS_${BUILD_DATE}.zip"
          
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "🎉 刷机包打包完成: $ZIP_NAME"

      - name: 8. 上传最终 AK3 刷机包 (直接可下载)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
